name: Release on Tag

# Wird ausgelöst, wenn ein Tag im Format v*.*.* gepusht wird
on:
  push:
    tags:
      - "v*.*.*"

# Erlaubt dem Action-Run, Releases zu erstellen
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Volle Historie für changelog

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag: v$VERSION"

      - name: Get commits since last tag
        id: commits
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            # Erstes Release - alle commits
            COMMITS=$(git log --oneline --no-merges)
            echo "Erstes Release - alle Commits"
          else
            COMMITS=$(git log ${PREV_TAG}..HEAD --oneline --no-merges)
            echo "Commits seit $PREV_TAG:"
          fi
          echo "$COMMITS"
          {
            echo "COMMITS<<EOF"
            echo "$COMMITS"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.get_version.outputs.VERSION }}"
          body: |
            ## Änderungen seit letztem Release

            ${{ steps.commits.outputs.COMMITS }}

            ## Installation (HACS)

            1. HACS → Integrationen → **MS To Do (Maton)**
            2. Update-Indikator sollte erscheinen (kann 15 Min dauern)
            3. **Aktualisieren** klicken
            4. HA neu starten

            ## Manuelle Installation

            ```bash
            cd /config/custom_components
            rm -rf ms_todo
            curl -L https://github.com/TomTje/ms-todo-ha/archive/refs/tags/v${{ steps.get_version.outputs.VERSION }}.tar.gz | tar -xz
            mv ms-todo-ha-v${{ steps.get_version.outputs.VERSION }}/custom_components/ms_todo .
            rm -rf ms-todo-ha-v${{ steps.get_version.outputs.VERSION }}
            ```

            ## Links

            - Repository: https://github.com/TomTje/ms-todo-ha
            - Issues: https://github.com/TomTje/ms-todo-ha/issues

            ---

            🤖 Auto-generated by GitHub Action
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
